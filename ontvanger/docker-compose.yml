# Compose-bestand voor de P2000-ontvanger, bruikbaar als stack in Portainer.
# Vul de MQTT-instellingen in bij 'environment' (het adres van de bestaande
# broker) en controleer dat de USB-stick wordt doorgegeven onder 'devices'.

services:
  p2000-ontvanger:
    build: .
    # Of een vooraf gebouwd image, als dat naar een register is gepusht:
    # image: ghcr.io/lowlandcoder/p2000-ontvanger:latest
    container_name: p2000-ontvanger
    restart: unless-stopped
    environment:
      MQTT_HOST: "192.168.2.38"      # lab023-server, waar Mosquitto draait
      MQTT_PORT: "1883"
      MQTT_TOPIC: "p2000/bericht"
      MQTT_USER: "p2000"
      MQTT_PASSWORD: "${MQTT_PASSWORD:?stel MQTT_PASSWORD in via .env}"  # uit .env, niet in git
      # Hartslag voor de waakhond: elke minuut een bewaard bericht met de
      # stand van de verwerking. Leeg laten zet de hartslag uit.
      STATUS_TOPIC: "p2000/status"
      STATUS_SECONDEN: "60"
      # -d 00000002 kiest de stick op serienummer, niet op apparaatnummer.
      # Die stick draagt de naam "p2000" en is alleen voor deze ontvanger.
      # Vaste gain 40 dB; werkt goed op deze plek.
      RTL_CMD: "rtl_fm -d 00000002 -f 169.65M -M fm -s 22050 -l 0 -g 40"
    devices:
      # De hele usb-bus doorgeven, zodat beide sticks zichtbaar zijn. De keuze
      # welke stick gebruikt wordt, valt in RTL_CMD op serienummer en niet op
      # het apparaatnummer, want dat nummer verschuift bij een herstart.
      - "/dev/bus/usb:/dev/bus/usb"
