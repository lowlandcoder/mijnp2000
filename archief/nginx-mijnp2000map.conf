# Nginx-instelling voor mijnp2000map.lab023.nl: de openbare kaart van
# MijnP2000.
#
# Dit serverblok stuurt door naar dezelfde container als mijnp2000.lab023.nl
# (mijnp2000-archief, poort 8200, alleen op localhost). Twee verschillen met
# het blok van mijnp2000:
#
#   1. Geen aanmelding. Er staat met opzet geen
#      `include snippets/lab023-login.conf;` in.
#   2. Alleen de kaart. De wortel gaat door naar /kaart en de lijstpagina met
#      het hele archief is hier niet te openen.
#
# De kop `X-Lab023-Alleen-Kaart` vertelt de backend dat dit die ingang is.
# /api/kaartinstellingen geeft dat door aan de pagina, die daarop de knoppen
# naar de lijst en naar de startpagina weglaat. Zonder de kop blijft alles bij
# het oude.
#
# Plaats dit als /etc/nginx/sites-available/mijnp2000map en activeer met een
# symlink naar sites-enabled. Vraag het certificaat aan met
# `sudo certbot certonly --nginx -d mijnp2000map.lab023.nl` en plaats dit
# bestand pas daarna in de vorm met een 443-blok.
#
# Let op: op de server hoort dit bestand een blok voor poort 443 met de
# certificaatregels te krijgen, plus een blok voor poort 80 dat alleen
# doorverwijst. De include-regel hoort in beide blokken.

server {
    listen 80;
    server_name mijnp2000map.lab023.nl;

    # Bekende scanpaden meteen weren.
    include snippets/lab023-blokkeer.conf;

    # Zoekmachines weren. Deze pagina heeft geen docroot op de server, dus het
    # bestand komt uit de gedeelde map /var/www/robots (zie de map robots in de
    # werkmap).
    location = /robots.txt {
        alias /var/www/robots/robots-blokkeer-alles.txt;
        default_type text/plain;
        access_log off;
    }

    # De wortel is hier de kaart, niet de lijst met meldingen.
    location = / {
        return 302 /kaart;
    }

    location = /index.html {
        return 302 /kaart;
    }

    # De lijstpagina hoort niet bij deze ingang; het script ervan dus ook niet.
    location = /script.js {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Lab023-Alleen-Kaart 1;
    }
}
