# Nginx-instelling voor mijnp2000map.lab023.nl: de openbare ingang van
# MijnP2000.
#
# Dit serverblok stuurt door naar dezelfde container als mijnp2000.lab023.nl
# (mijnp2000-archief, poort 8200, alleen op localhost). Het verschil zit in de
# afscherming: mijnp2000.lab023.nl blijft achter de centrale aanmelding, dit
# subdomein is zonder inloggen te openen. De kaart staat op /kaart, de lijst
# met meldingen op /.
#
# Plaats dit als /etc/nginx/sites-available/mijnp2000map en activeer met een
# symlink naar sites-enabled. Vraag het certificaat aan met
# `sudo certbot certonly --nginx -d mijnp2000map.lab023.nl` en plaats dit
# bestand pas daarna in de vorm met een 443-blok.
#
# Let op: op de server bouwt Certbot dit bestand om naar een serverblok voor
# poort 443 met certificaatregels, plus een blok voor poort 80 dat alleen
# doorverwijst. De include-regel en het robots-blok horen in het 443-blok; de
# include-regel hoort ook in het blok voor poort 80.

server {
    listen 80;
    server_name mijnp2000map.lab023.nl;

    # Bekende scanpaden meteen weren.
    include snippets/lab023-blokkeer.conf;

    # Met opzet geen `include snippets/lab023-login.conf;`. Dit subdomein is
    # openbaar; de afgeschermde ingang blijft mijnp2000.lab023.nl.

    # Zoekmachines weren. Deze pagina heeft geen docroot op de server, dus het
    # bestand komt uit de gedeelde map /var/www/robots (zie de map robots in de
    # werkmap).
    location = /robots.txt {
        alias /var/www/robots/robots-blokkeer-alles.txt;
        default_type text/plain;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
